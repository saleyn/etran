name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        otp: [26, 27, 28, 29]
        # include:
        # - otp: 29
        #   allow-failure: true

    #continue-on-error: ${{ matrix.allow-failure == true }}

    container:
      image: erlang:${{ matrix.otp }}

    steps:
    - uses: actions/checkout@v2
    - name: Install gawk
      run:  apt update && apt install sudo && sudo apt-get install -y gawk
    - name: Compile
      run:  make
    - name: Run tests
      run:  make test
    #- name: Make documentation
    #  run:  make gh-pages
